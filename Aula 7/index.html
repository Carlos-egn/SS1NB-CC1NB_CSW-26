<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <table border="1">
        <Tr>
            <td>Digite um Comentário</td>
        </Tr>
        <tr>
            <td><textarea name="Comentário" cols="50" rows="10" placeholder="Escreva aqui um Comentário"></textarea>
            </td>
        </tr>
        <tr>
            <td colspan="">Material de interesse
                <label for="">Selecione um tipo de conteúdo</label>
                <br>
                <input type="checkbox" name="Back" value="Back"> BackEnd <br>
                <input type="checkbox" name="Front" value="Front"> FrontEnd <br>
                <input type="checkbox" name="Full" value="Full"> Fullstack <br>
            </td>
            <br>
            <td>Tipo de Viagem
                <label for="">Selecione um tipo de conteúdo</label>
                <br>
                <input type="checkbox" name="Back" value="Back"> Negócios <br>
                <input type="checkbox" name="Front" value="Front"> Laser <br>
                <input type="checkbox" name="Full" value="Full"> Turismo <br>
                <input type="checkbox" name="Full" value="Full"> Acadêmico <br>
            </td>
        </tr>
        <tr>
            <td>
                <label for="">Esporte Favorito: </label>
                <select name="Esportes" size="5" multiple>
                    <option value="">Selecione</option>
                    <option value="Futebol">Futebol</option>
                    <option value="Basquete">Basquete</option>
                    <option value="Tênis">Tênis</option>
                    <option value="Volei">Volei</option>
                </select>

            </td>
            <td>
                <label for="">Investimento </label>
                <select name="Ações" size="1">
                    <option value="">Ações</option>
                    <option value="Futebol">Futebol</option>
                    <option value="Basquete">Basquete</option>
                    <option value="Tênis">Tênis</option>
                    <option value="Volei">Volei</option>
                </select>

            </td>
        </tr>
        <tr>
            <td>
                Escolha uma cor
            </td>
            <td>
                Selecione um Arquivo
            </td>

        </tr>
        <tr>
            <td>
                Data de Envio
                <input type="datetime-local" name="dtlocal" id="dt-local">
            </td>
        </tr>
        <tr>
            <td>
                <input type="submit" value="Enviar">
            </td>
            <td>
                <input type="reset" value="Limpar">
            </td>
        </tr>



    </table>

</body>

</html>
