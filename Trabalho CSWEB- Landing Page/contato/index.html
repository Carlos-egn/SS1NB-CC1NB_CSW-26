    <h2 style="border-collapse: collapse; text-align: center;">Quer realizar um orçamento? </H2>
    <p style="border-collapse: collapse; text-align: center;">Preenchendo o Formulário a seguir.</p>

    <div style="display: flex; justify-content: center; align-items: center;">
        <table border="1">

            <form>
                <tr>
                    <td>
                        Nome: <input type="text"><br></td>
                </tr>
                <tr>
                    <td>
                        Email: <input type="email"><br></td>
                </tr>
                <tr>
                    <td>
                        Telefone: <input type="text"><br></td>
                </tr>
                <tr>
                    <td>Tipo de Pessoa
                        <select>
                            <option value="fisica">Pessoa-Física</option>
                            <option value="juridica">Pessoa-Jurídica</option>

                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Tipo de Serviço
                        <select>
                            <option value="Orçamento">Orçamento</option>
                            <option value="Contratar">Contratar</option>
                            <option value="Agendamento">Agendamento Visita</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Escolha a data e hora:
                    
                        <input type="datetime-local" name="dtlocal " id="dt-local">
                    </td>
                </tr>

                <Tr>
                    <td>Digite o que precisa:</td>
                </Tr>
                <tr>
                    <td><textarea name="Comentário" cols="50" rows="10" placeholder="Escreva aqui..."></textarea>
                    </td>
                </tr>

                <tr>
                    <td><button>Enviar</button></td>
                </tr>
